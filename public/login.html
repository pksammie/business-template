<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login | TIMELESS</title>

    <link rel="stylesheet" href="/css/index.css">
    <link rel="stylesheet" href="/css/auth.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>
<script src="/js/theme-init.js"></script>

<div class="background-glow"></div>

<div class="auth-container">

    <div class="auth-logo">

        TIME<span>LESS</span>

    </div>

    <p class="auth-subtitle">

        Welcome back.<br>

        Sign in to continue shopping.

    </p>

    <form
        id="loginForm"
        class="auth-form">

        <div class="input-group">

            <i class="fa-solid fa-envelope"></i>

            <input
                id="email"
                type="email"
                placeholder="Email Address"
                required>

        </div>

        <div class="input-group">

            <i class="fa-solid fa-lock"></i>

            <input
                id="password"
                type="password"
                placeholder="Password"
                required>

            <button
                type="button"
                id="togglePassword">

                <i class="fa-solid fa-eye"></i>

            </button>

        </div>

        <div class="login-options">

            <label class="remember">

                <input type="checkbox">

                Remember me

            </label>

            <a
                href="/forgot-password"
                class="forgot-password">

                Forgot Password?

            </a>

        </div>

        <button
            type="submit"
            class="login-btn">

            Login

        </button>

    </form>

    <div class="divider">

        <span>OR</span>

    </div>

    <button
        id="googleLogin"
        class="google-btn">

        <img
            src="https://www.svgrepo.com/show/475656/google-color.svg"
            alt="Google">

        Continue with Google

    </button>

    <div
        id="forgotContainer"
        class="auth-links">

    </div>

    <div class="auth-links">

        Don't have an account?

        <a href="/register">

            Create One

        </a>

    </div>

</div>

<script
    type="module"
    src="/js/login.js">

</script>

<script
    type="module"
    src="/js/guard.js">

</script>

<script
    src="/js/toast.js">

</script>

</body>

</html>
