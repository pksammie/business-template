<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Bag - Vanguard</title>
    <link rel="stylesheet" href="/css/index.css" />
    <link rel="stylesheet" href="/css/cart.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  </head>
  <body>

    <header class="luxury-nav">
      <div class="nav-left-menu"><a href="/">Catalog</a></div>
      <div class="main-signature-logo">
        <a href="/" style="text-decoration:none; color:inherit;">VAN<span>GUARD</span></a>
      </div>
      <div class="nav-right-actions"></div>
    </header>

    <main class="store-mainframe">

      <h1 style="font-size:22px; font-weight:400; letter-spacing:2px; margin-bottom:20px; text-transform:uppercase;">
        Your Shopping Cart
      </h1>

      <!-- Update mode banner -->
      <p id="update-mode-message" class="update-banner" style="display:none;">
        Select the product you wish to update, then click Update Cart again.
      </p>

      <!-- Two-column layout: items left, summary right -->
      <div class="cart-layout">

        <!-- LEFT: scrollable item cards -->
        <div id="cart-items-container" class="cart-cards-grid"></div>

        <!-- RIGHT: sticky order summary panel -->
        <div class="cart-summary-panel">

          <h3>Order Summary</h3>

          <!-- Subtotal -->
          <div class="summary-subtotal-row">
            <span>Subtotal</span>
            <span id="summary-subtotal">₦0.00</span>
          </div>

          <div class="summary-divider"></div>

          <!-- Action buttons -->
          <div class="cart-control-button-grid">

            <!-- Primary: checkout -->
            <button class="checkout-primary-btn" onclick="actionProceedCheckout()">
              Proceed to Checkout
            </button>

            <!-- Secondary row -->
            <div class="cart-secondary-actions">
              <button class="btn-continue" onclick="actionContinueShopping()">
                Continue Shopping
              </button>
              <button class="btn-update" onclick="actionUpdateCartRedirect()">
                Update Cart
              </button>
            </div>

            <!-- Clear cart -->
            <button class="btn-clear" onclick="clearCart()">
              <i class="fa-solid fa-trash"></i>
              Clear Cart
            </button>

          </div>

          <div class="summary-divider"></div>

          <!-- Restore cart -->
          <div class="restore-cart-section">
            <p class="restore-cart-title">Recover an old cart?</p>
            <div class="restore-cart-controls">
              <button id="restore-cart-btn">
                <i class="fa-solid fa-clock-rotate-left"></i>
                Restore
              </button>
              <select id="restore-range">
                <option value="1">Last Hour</option>
                <option value="24">Last 24 Hours</option>
                <option value="168">Last 7 Days</option>
                <option value="720">Last Month</option>
                <option value="all">All Time</option>
              </select>
            </div>
          </div>

        </div>
        <!-- end summary panel -->

      </div>
      <!-- end cart-layout -->

    </main>

    <script src="/js/modal.js"></script>
    <script src="/js/toast.js"></script>
    <script type="module" src="/js/cart.js"></script>
    <script type="module" src="/js/route-guard.js"></script>
    <script type="module" src="/js/guard.js"></script>
    <script type="module" src="/js/cart-count.js"></script>

  </body>
</html>
