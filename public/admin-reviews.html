<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Review Manager</title>

<link rel="stylesheet" href="/css/index.css">
<link rel="stylesheet" href="/css/admin.css">
<link rel="stylesheet" href="/css/admin-reviews.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>
<script src="/js/theme-init.js"></script>

<div class="top-bar">

<span>Review Management</span>

<a href="/admin-panel"
class="view-store-btn">

← Admin Panel

</a>

</div>

<header class="luxury-nav">

<div class="main-signature-logo">

TIMELESS

<span>

REVIEWS

</span>

</div>

</header>

<main class="store-mainframe">

<section class="admin-section">

<div class="admin-page-header">
    <div>
        <h2>Customer Reviews</h2>
        <p class="admin-page-subtitle">See what customers are saying, reply, and choose which reviews feature on your homepage.</p>
    </div>
</div>

<div class="page-toolbar">

<div class="orders-search-wrapper">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input
        type="text"
        id="orders-search"
        placeholder="Search customer or review...">
</div>

<div id="rating-filter-mount" class="rating-filter-mount"></div>

</div>

<div
id="reviews-container"
class="admin-reviews-grid">

</div>

<div id="reviews-pagination" class="admin-pagination"></div>

</section>

</main>

<div id="view-review-modal" class="review-reason-overlay">

    <div class="review-reason-modal">

        <button
            class="close-review-modal"
            id="close-view-modal">

            ×

        </button>

        <h3>Full Review</h3>

        <p id="view-review-text" class="view-review-full-text"></p>

    </div>

</div>

<div id="reply-modal" class="review-reason-overlay">

    <div class="review-reason-modal">

        <button
            class="close-review-modal"
            id="close-reply-modal">

            ×

        </button>

        <h3>Reply To Review</h3>

        <textarea
            id="admin-reply-text"
            placeholder="Write your reply..."></textarea>

        <button
            id="send-admin-reply">

            Send Reply

        </button>

    </div>

</div>

<script type="module"
src="/js/admin-reviews.js"></script>

<div id="vanguard-confirm-modal" class="vanguard-modal">
    <div class="vanguard-modal-box">
        <h3 id="vanguard-modal-title">Confirm Action</h3>

        <p id="vanguard-modal-message">
            Are you sure?
        </p>

        <div class="vanguard-modal-actions">
            <button id="vanguard-modal-cancel">
                Cancel
            </button>

            <button id="vanguard-modal-confirm">
                Confirm
            </button>
        </div>
    </div>
</div>

<script src="/js/toast.js"></script>

</body>

</html>
