<!DOCTYPE html>
<html>

<head>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,600&display=swap"
  rel="stylesheet"
/>

<link rel="stylesheet" href="/css/admin-check.css">

</head>

<body>
<script src="/js/theme-init.js"></script>
<script>document.body.classList.add("scroll-locked");</script>

<div class="scene-backdrop">
    <div class="spotlight"></div>
    <div class="dust"></div>
</div>

<div id="admin-loader">

    <div class="vanguard-ring">

        <div class="ring"></div>

        <div class="ring"></div>

        <div class="ring"></div>

    </div>

    <h2>
        Verifying Timeless Credentials
    </h2>

    <p>
        Please wait...
    </p>

</div>

<div id="admin-denied">

    <svg class="guard-lock" viewBox="0 0 120 140" aria-hidden="true">

        <rect class="lock-body" x="15" y="55" width="90" height="75" rx="10"/>

        <path
            class="lock-shackle"
            d="M32 55 V38 C32 18 88 18 88 38 V55"
        />

        <circle class="lock-keyhole" cx="60" cy="90" r="7"/>

        <rect class="lock-keyhole-stem" x="56" y="94" width="8" height="18" rx="3"/>

    </svg>

    <h2 id="denied-title">
        Restricted Area
    </h2>

    <p id="denied-message">
        You do not have permission to access Timeless Admin.
    </p>

    <a href="/" class="guard-return-btn">
        Return To Storefront
    </a>

</div>

<script type="module" src="/js/admin-guard.js"></script>

</body>

</html>
